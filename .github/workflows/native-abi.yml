name: native-abi

# Compile + ABI gate for the native shim.
#
# This builds against the pinned audio.cpp revision using AUDIOCPP_MODEL_SET=core,
# which selects the engine with no model loaders, and disables the model manager so
# no BoringSSL download is needed. That keeps the gate fast.
#
# It is deliberately NOT the shipping configuration. Released shims are full-set
# builds, produced by the eng/matrix scripts on a machine that has the toolchain and
# (for CUDA) the GPU; this workflow only proves the shim still compiles against the
# pin and that the exported ABI surface still matches what managed code expects.

on:
  push:
    paths:
      - 'native/**'
      - 'CMakeLists.txt'
      - 'eng/**'
      - '.github/workflows/native-abi.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'CMakeLists.txt'
      - 'eng/**'
      - '.github/workflows/native-abi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shim:
    name: shim ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # CMakeLists.txt asserts the checkout is at the pinned revision, so fetch that
      # exact commit rather than a branch tip. Both the URL and the SHA come from
      # eng/upstream.lock.json, which is the single source of truth for the pin.
      - name: Check out the pinned audio.cpp revision
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sed -n 's/.*"commit": *"\([0-9a-f]\{40\}\)".*/\1/p' eng/upstream.lock.json | head -1)
          URL=$(sed -n 's/.*"repository": *"\([^"]*\)".*/\1/p' eng/upstream.lock.json | head -1)
          test -n "$SHA" || { echo "could not read the pinned commit from eng/upstream.lock.json"; exit 1; }
          test -n "$URL" || { echo "could not read the upstream repository from eng/upstream.lock.json"; exit 1; }
          case "$URL" in *.git) ;; *) URL="$URL.git" ;; esac
          # The shim expects upstream to be its sibling (AUDIOCPP_SRC defaults to
          # ../audio.cpp), so the directory name is part of the contract.
          UPSTREAM="$GITHUB_WORKSPACE/../audio.cpp"
          git init "$UPSTREAM"
          git -C "$UPSTREAM" remote add origin "$URL"
          git -C "$UPSTREAM" fetch --depth 1 origin "$SHA"
          git -C "$UPSTREAM" checkout --detach FETCH_HEAD
          echo "pinned upstream: $(git -C "$UPSTREAM" rev-parse HEAD) (expected $SHA)"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          # Do not name a Visual Studio generator here. The windows-latest image
          # moves its VS version -- it now ships VS 18 (2026), not VS 17 (2022) --
          # and a pinned name fails with
          #   Generator "Visual Studio 17 2022" could not find any instance of
          #   Visual Studio.
          # the day the image updates. Omitting -G lets CMake select the newest
          # installed Visual Studio and keeps this workflow self-maintaining;
          # -A x64 pins the target architecture. Linux keeps Ninja plus an
          # explicit single-config build type.
          if [ "$RUNNER_OS" = "Windows" ]; then
            GEN=(-A x64)
          else
            GEN=(-G Ninja)
          fi
          cmake -S . -B build/native-ci "${GEN[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUDIOCPP_BACKEND=cpu \
            -DAUDIOCPP_MODEL_SET=core \
            -DAUDIOCPP_DOTNET_ENABLE_MODEL_MANAGER=OFF

      - name: Build shim and ABI smoke
        run: >
          cmake --build build/native-ci --config Release
          --target audiocpp_dotnet_native audiocpp_dotnet_abi_smoke
          --parallel

      # abi_smoke links against the shim and asserts the ABI version, the required
      # capability bits, the task catalog (canonical tokens plus model_spec aliases)
      # and that the newer entry points resolve. A forgotten export or a schema bump
      # fails here rather than inside managed code.
      - name: Run ABI smoke
        shell: bash
        run: |
          set -euo pipefail
          # Match the executable by exact name, and prune MSBuild's *.dir
          # intermediate trees. The previous pattern 'audiocpp_dotnet_abi_smoke*'
          # also matched
          #   audiocpp_dotnet_abi_smoke.dir/Release/*.tlog/audiocpp_dotnet_abi_smoke.lastbuildstate
          # and find returned that first, so bash tried to execute an MSBuild tlog
          # as a script -- "line 2: Release: command not found", exit 127. Ninja
          # (Linux) writes the binary flat and has no such intermediates, which is
          # why only Windows failed.
          SMOKE=$(find build/native-ci \
                    -type d -name '*.dir' -prune -o \
                    -type f \( -name 'audiocpp_dotnet_abi_smoke' \
                               -o -name 'audiocpp_dotnet_abi_smoke.exe' \) -print \
                  | head -1)
          test -n "$SMOKE" || { echo "could not locate the ABI smoke binary"; exit 1; }
          echo "running $SMOKE"
          "$SMOKE"
