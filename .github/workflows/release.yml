name: release

# packages on nuget.org and pushes them.
#
# Publishing uses nuget.org trusted publishing (OIDC): no API key secret is stored.
# The trust entry on nuget.org names this repository, this workflow file and the
# `release` environment, so the publish job declares that environment and asks for
# an id-token; the SDK exchanges the OIDC token for a short-lived push token. That
# is also why a fork pull request cannot publish even if it somehow reaches this
# job: it cannot obtain a token for a repository the trust entry does not name.
#
# Two entry points:
#
#   * push a version tag (v0.1.0)  -> published automatically
#   * workflow_dispatch            -> same, with the version and target overridable
#                                     and a switch to build without publishing
#
# The managed package (AudioCpp.NET) is built from source and always ships.
#
# The runtime packages carry prebuilt native shims, which cannot be built on a
# GitHub-hosted runner: a full-set shim needs the audio.cpp toolchain, and the CUDA
# one needs an NVIDIA toolkit and GPU. They are therefore assembled from native
# archives attached to a GitHub Release, produced by
# eng/packaging/make-native-archives.ps1 on a machine that can build them. If those
# archives are absent the runtime packages are skipped with a warning and the release
# still proceeds for the managed package.
#
# The archives must also come with audiocpp-native-manifest.json, which records the
# audio.cpp commit and shim ABI they were built from. A tag release refuses to publish
# the runtime packages when that fingerprint is missing or disagrees with
# eng/upstream.lock.json: shipping an ABI 1.3 runtime beside an ABI 1.4 managed
# package passes every check here and fails only at a consumer's call site. Manual
# runs can override with strict_natives=false, which downgrades it to a managed-only
# package plus a job summary.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0 (must match the native archives).'
        required: true
      native_release_tag:
        description: 'Release tag holding the audiocpp-native-*.zip assets. Defaults to v<version>.'
        required: false
      publish:
        description: 'Push to nuget.org. Leave unchecked to only build and inspect.'
        type: boolean
        default: false
      strict_natives:
        description: 'Refuse to publish runtime packages whose native archives were built for a different audio.cpp pin (a tag push always does this).'
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  resolve:
    name: resolve version and native availability
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      enforce_native_pin: ${{ steps.v.outputs.enforce_native_pin }}
    steps:
      - id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.native_release_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_STRICT: ${{ inputs.strict_natives }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            # v0.1.0 -> 0.1.0
            version="${REF_NAME#v}"
            tag="$REF_NAME"
            publish="true"
            # A tag release is the one that reaches consumers, so it never ships
            # runtime packages whose shim was built for another pin.
            enforce_native_pin="1"
          else
            version="$INPUT_VERSION"
            tag="${INPUT_TAG:-v$INPUT_VERSION}"
            publish="${INPUT_PUBLISH:-false}"
            enforce_native_pin="${INPUT_STRICT:-true}"
          fi
          test -n "$version" || { echo "no version resolved"; exit 1; }
          # SemVer sanity: a malformed version would only fail deep inside pack.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a SemVer version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "enforce_native_pin=$enforce_native_pin" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$version tag=$tag publish=$publish enforce_native_pin=$enforce_native_pin"

  verify:
    name: managed tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, build, test
        run: |
          dotnet restore AudioCpp.NET.slnx
          dotnet build AudioCpp.NET.slnx -c Release --no-restore
          dotnet test tests/AudioCpp.NET.Tests -c Release --no-build --nologo

  pack:
    name: pack
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Provenance gate. Archives are prebuilt binary artefacts that CI cannot
      # rebuild, so they can be carried over from an older release by mistake. The
      # manifest records the audio.cpp commit and shim ABI they were built from; a
      # mismatch would publish a managed package built against shim ABI 1.4 next to
      # a runtime package built against 1.3, which no test here catches and which a
      # consumer only sees as a missing export at call time. continue-on-error keeps
      # the failure legible: the decide step turns it into either a hard stop (tag
      # release) or a managed-only package with a loud summary (manual run).
      - name: Fetch native provenance manifest from the release
        id: manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p native-archives
          gh release download "${{ needs.resolve.outputs.tag }}" \
             --repo "${{ github.repository }}" \
             --pattern 'audiocpp-native-manifest.json' \
             --dir native-archives

      - name: Fetch native shim archives from the release
        id: natives
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p native-archives
          gh release download "${{ needs.resolve.outputs.tag }}" \
             --repo "${{ github.repository }}" \
             --pattern 'audiocpp-native-*.zip' \
             --dir native-archives
          ls -la native-archives

      - name: Stage native shims
        id: stage
        if: steps.natives.outcome == 'success'
        continue-on-error: true
        env:
          AUDIOCPP_ENFORCE_NATIVE_PIN: ${{ needs.resolve.outputs.enforce_native_pin }}
        run: bash eng/packaging/import-native-archives.sh native-archives

      - name: Decide the fate of the runtime packages
        id: decide
        env:
          ENFORCE: ${{ needs.resolve.outputs.enforce_native_pin }}
          NATIVES: ${{ steps.natives.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          STAGE: ${{ steps.stage.outcome }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          runtime=skipped
          reason=""
          if [ "$NATIVES" != "success" ]; then
            reason="release '$TAG' carries no audiocpp-native-*.zip"
          elif [ "$MANIFEST" != "success" ]; then
            reason="release '$TAG' has archives but no audiocpp-native-manifest.json, so their audio.cpp pin cannot be verified"
          elif [ "$STAGE" = "success" ]; then
            runtime=staged
          else
            reason="the archives on '$TAG' were built for a different audio.cpp commit than eng/upstream.lock.json pins (see the Stage native shims step)"
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

          # Which RIDs actually landed, so the package check asserts the real set
          # instead of assuming both. A release carrying only the Windows archives
          # is legitimate while the Linux shim is unavailable; what must never happen
          # is a package that contains a RID nobody staged for this release.
          rids=""
          for rid in win-x64 linux-x64; do
            if compgen -G "build/nuget-staging/*/$rid/*" > /dev/null; then
              rids="${rids:+$rids,}$rid"
            fi
          done
          echo "rids=$rids" >> "$GITHUB_OUTPUT"

          if [ "$runtime" = "skipped" ]; then
            if [ "$ENFORCE" = "1" ]; then
              echo "::error title=Refusing to publish::$reason"
              echo "Rebuild them for the pinned commit (eng/packaging/make-native-archives.ps1),"
              echo "attach audiocpp-native-*.zip and audiocpp-native-manifest.json to '$TAG', and re-run."
              echo "Set the strict_natives=false dispatch input to override and publish AudioCpp.NET alone."
              exit 1
            fi
            echo "::warning title=Runtime packages will be skipped::$reason"
            {
              echo "### Runtime packages skipped"
              echo
              echo "Reason: $reason"
              echo
              echo "Only AudioCpp.NET was packed. It carries no native runtime, so consumers"
              echo "also need AudioCpp.NET.Runtime (CPU), AudioCpp.NET.Runtime.Cuda (NVIDIA)"
              echo "or AudioCpp.NET.Runtime.Vulkan (any Vulkan 1.2+ GPU)"
              echo "from a release whose archives match the pinned audio.cpp commit."
              echo
              echo "Fix: run eng/packaging/make-native-archives.ps1 against the pinned checkout,"
              echo "attach audiocpp-native-*.zip **and** audiocpp-native-manifest.json to '$TAG',"
              echo "then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "runtime packages: $runtime${reason:+ ($reason)}"
          if [ "$runtime" = "staged" ] && [ "$rids" != "win-x64,linux-x64" ]; then
            echo "::warning title=Partial RID coverage::this release carries [$rids], not both platforms"
            {
              echo "### Partial RID coverage"
              echo
              echo "Staged RIDs: \`$rids\`"
              echo
              echo "The runtime packages contain only these platforms. Consumers on the"
              echo "other platform get a DllNotFoundException on first use, not at install"
              echo "time. Build the missing archive and re-run to cover both."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pack
        env:
          RUNTIME: ${{ steps.decide.outputs.runtime }}
        run: |
          set -euo pipefail
          V="${{ needs.resolve.outputs.version }}"
          mkdir -p packages
          dotnet pack src/AudioCpp.NET/AudioCpp.NET.csproj -c Release -o packages -p:Version="$V"
          if [ "$RUNTIME" = "staged" ]; then
            dotnet pack src/AudioCpp.NET.Runtime/AudioCpp.NET.Runtime.csproj -c Release -o packages -p:Version="$V"
            dotnet pack src/AudioCpp.NET.Runtime.Cuda/AudioCpp.NET.Runtime.Cuda.csproj -c Release -o packages -p:Version="$V"
            # Vulkan is optional per release: a tag built before the backend existed
            # (or one whose Vulkan archives could not be produced) must still publish the
            # CPU and CUDA packages instead of failing pack on a missing staging dir.
            if compgen -G "build/nuget-staging/vulkan/*" > /dev/null; then
              dotnet pack src/AudioCpp.NET.Runtime.Vulkan/AudioCpp.NET.Runtime.Vulkan.csproj -c Release -o packages -p:Version="$V"
            else
              echo "::warning title=Vulkan runtime package skipped::no build/nuget-staging/vulkan in this release"
              echo "Backends: \`cpu\` \`cuda\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "--- produced ---"
          ls -la packages

      # Asserts the artifacts really contain the natives and the interop assembly,
      # so a packaging regression fails here instead of at a consumer's first run.
      - name: Verify package contents
        env:
          RUNTIME: ${{ steps.decide.outputs.runtime }}
          RIDS: ${{ steps.decide.outputs.rids }}
        run: |
          set -euo pipefail
          mode=skipped
          backends=""
          if [ "$RUNTIME" = "staged" ]; then
            mode=staged
            echo "staged RIDs: ${RIDS:-<none>}"
            # Verify exactly the runtime packages this release packed. The Vulkan
            # package is conditional (see Pack), so a release without its archives
            # must not be asserted to contain one.
            for backend in cpu cuda vulkan; do
              if compgen -G "build/nuget-staging/$backend/*" > /dev/null; then
                backends="${backends:+$backends,}$backend"
              fi
            done
            echo "staged backends: $backends"
          fi
          python3 eng/packaging/verify_packages.py packages --natives "$mode" --rids "${RIDS:-win-x64,linux-x64}" --backends "$backends"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            packages/*.nupkg
            packages/*.snupkg
          if-no-files-found: error

  publish:
    name: push to nuget.org
    needs: [resolve, pack]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC) instead of a stored API key: nuget.org trusts this
    # repository, this workflow and this environment, and exchanges the token for a
    # one-hour push key. There is no long-lived secret to leak or rotate, and a fork
    # pull request cannot obtain one.
    #
    # IMPORTANT: `dotnet nuget push` has NO built-in OIDC exchange (verified against
    # the .NET 10 CLI docs and learn.microsoft.com/nuget/nuget-org/trusted-publishing).
    # The official flow is the NuGet/login@v1 action: it mints an OIDC token
    # (audience https://www.nuget.org), posts it to nuget.org's token endpoint and
    # exposes the temporary API key as an output. The push step then sends that key
    # like any other.
    #
    # `environment` is part of the trust relationship configured on nuget.org, so it
    # has to match that entry exactly; `id-token: write` is what lets the login step
    # request the OIDC token in the first place. Both are required.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # The push itself needs a dotnet SDK; the OIDC exchange lives in the
      # NuGet/login action, not in the CLI.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages

      # --skip-duplicate keeps a re-run idempotent: a partially published release can
      # be retried without failing on the packages that already landed.
      #
      # The probe below decodes the OIDC token payload (claims only -- the JWT itself
      # is masked, not printed) so the trust fields can be compared against the
      # nuget.org publisher entry line by line. A mismatch surfaces at the login step
      # as "No matching trust policy", but the probe shows WHICH claim is off.
      # NOTE: the decode helper must stay a ONE-LINE python -c. A multi-line one would
      # put unindented lines inside this `run: |` block, which terminates the block
      # scalar and rips the workflow_dispatch trigger out of the parsed document
      # (manifested as "Workflow does not have 'workflow_dispatch' trigger" on dispatch).
      - name: Probe the OIDC token
        run: |
          set -euo pipefail
          echo "::add-mask::$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::no OIDC request credentials in the environment -- the job lacks 'permissions: id-token: write'"
            exit 1
          fi
          RESP=$(curl -sS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.nuget.org" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          JWT=$(printf '%s' "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',''))")
          if [ -z "$JWT" ]; then
            echo "::error::no OIDC token returned: $(printf '%s' "$RESP" | head -c 200)"
            exit 1
          fi
          echo "OIDC token claims (audience https://www.nuget.org):"
          printf '%s' "$JWT" | cut -d. -f2 | tr '_-' '/+' | python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); c=json.loads(base64.b64decode(p)); [print('  %-20s' % k, c.get(k, '<absent>')) for k in ('iss','aud','sub','repository','repository_owner','workflow','job_workflow_ref','ref','environment','environment_ref','run_id','actor')]"

      # Exchanges the job's OIDC token for a one-hour NuGet API key. The `user` is the
      # nuget.org profile name (package owner), which is public information; no
      # secret is involved. This is the OFFICIAL trusted-publishing flow -- the dotnet
      # CLI cannot do this exchange by itself.
      - name: NuGet login (OIDC to temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: wenlee

      - name: Push packages
        run: |
          set -euo pipefail
          dotnet nuget push "packages/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          for s in packages/*.snupkg; do
            [ -e "$s" ] || continue
            dotnet nuget push "$s" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # The NuGet/login step prints the token exchange's real error ("No matching
      # trust policy owned by user ... was found"), so a trusted-publishing
      # misconfiguration no longer hides behind the anonymous-fallback 401. The step
      # below restates the local side of the trust relationship for quick diffing.
      - name: Explain a push failure
        if: failure()
        run: |
          set -uo pipefail
          echo "### Why the trusted-publishing push failed"
          echo
          echo "Environment (expected: release) : ${GITHUB_ENVIRONMENT:-<none>}"
          echo "Repository   : ${GITHUB_REPOSITORY}"
          echo "Workflow     : ${GITHUB_WORKFLOW_REF}"
          echo
          echo "On nuget.org the trusted publisher must match all three of those."
          echo "Common causes, in the order they are usually hit:"
          echo "  1. The grant is the 7-day trial and has expired -- reactivate it on"
          echo "     nuget.org (Trusted Publishing page; the window restarts on demand)."
          echo "  2. The publisher entry's scopes do not cover the package being pushed"
          echo "     (the entry is account-level; its glob pattern must match the IDs)."
          echo "  3. The workflow filename or environment does not match exactly."
          echo "  4. A newly pushed version is reserved by someone else; --skip-duplicate"
          echo "     only skips versions already on the feed."

      - name: Summary
        run: |
          {
            echo "### Published ${{ needs.resolve.outputs.version }}"
            echo
            echo '```'
            unzip -l packages/AudioCpp.NET.*.nupkg | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
